<script>
const SUPABASE_URL='https://xshnochrinvblixkhiny.supabase.co',SUPABASE_KEY='sb_publishable_RnWG0MJ3dEBOzl1Hfib51Q_WqwcwF7R';
const SU=['♣','♦','♥','♠'],RN={11:'J',12:'Q',13:'K',14:'A'},rn=r=>RN[r]||r;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Hand scoring: arrays compared left to right. Suits: spade 4 > heart 3 > diamond 2 > club 1.
function score(h){
  const c=h.slice().sort((a,b)=>b[0]-a[0]||b[1]-a[1]),r=c.map(x=>x[0]),top=c[0][1];
  const flush=c.every(x=>x[1]==top);
  if(r[0]==r[2])return[7,r[0]];
  let seq=null;
  if(r[0]==5&&r[1]==3&&r[2]==2)seq=1000;            // 235 is the top sequence
  else if(r[0]==14&&r[1]==3&&r[2]==2)seq=13.5;       // A23 sits just below AKQ
  else if(r[0]-r[1]==1&&r[1]-r[2]==1)seq=r[0];       // AKQ=14 ... 432=4
  if(flush&&seq!==null)return[6,seq,top];
  if(seq!==null)return[5,seq,top];
  if(flush)return[4,...r,top];
  if(r[0]==r[1]||r[1]==r[2]){const pc=c.filter(x=>x[0]==r[1]);return[3,r[1],r[0]==r[1]?r[2]:r[0],Math.max(...pc.map(x=>x[1]))];}
  return[2,...r,top];
}
const cmp=(a,b)=>{for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0};
const hname=h=>['','','High card','Pair','Colour','Sequence','Pure sequence','Trail'][score(h)[0]];

const $=id=>document.getElementById(id),app=$('app');
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
let G=null,me={id:null,name:''},sb,code,ver=-1,just=false,rs=0,draft=null,tuv='',flipT=0,dealT=0,hs='',animRound=-1;
const idx=()=>G.players.findIndex(p=>p.id==me.id),inWait=()=>(G.wait||[]).some(p=>p.id==me.id);
const live=()=>G.players.map((p,i)=>i).filter(i=>!G.players[i].packed);
const lg=s=>{G.log.push(s);if(G.log.length>30)G.log.shift()};
const ev=k=>{G.evs=(G.evs||[]).concat([k]).slice(-12);G.evn=(G.evn||0)+1};
const cardH=(c,hide,sm,ci=0)=>{
  const now=Date.now();
  if(hide){const dl=!sm&&now<dealT+1500;return `<div class="c bk ${sm?'sm':''} ${dl?'dl':''}" ${dl?`style="animation-delay:${(0.5+ci*0.12-(now-dealT)/1000).toFixed(2)}s"`:''}></div>`}
  const red=c[1]==2||c[1]==3?'r':'',txt=rn(c[0])+'<span>'+SU[c[1]-1]+'</span>';
  if(sm||now>=flipT+900)return `<div class="c ${red} ${sm?'sm':''}">${txt}</div>`;
  return `<div class="fc" style="animation-delay:${(ci*0.12-(now-flipT)/1000).toFixed(2)}s"><div class="c ${red}">${txt}</div><div class="c bk bsd"></div></div>`;
};

/* ---------- database ---------- */
async function save(){
  render();
  const r=await sb.from('rooms').update({state:G,version:ver+1}).eq('code',code).eq('version',ver).select('version');
  if(r.error){alert('Save failed: '+r.error.message);return false}
  if(!r.data.length){await pull(true);return false}
  ver=r.data[0].version;return true;
}
async function pull(force){
  const r=await sb.from('rooms').select('state,version').eq('code',code).maybeSingle();
  if(r.error||!r.data)return;
  if(force||r.data.version!==ver){G=r.data.state;ver=r.data.version;render()}
}
function login(){
  app.innerHTML=`<div class="panel"><div class="gl">Join a table</div>
  <input id="nm" placeholder="Your name" maxlength="14" value="${esc(ls('tp_n')||'')}">
  <input id="rm" placeholder="Room code (any word, share with friends)" maxlength="20" value="${esc(ls('tp_r')||'')}">
  <button class="pri" data-a="join">Join game</button><button data-a="spec">Spectate</button></div>`;
}
let spectate=false;
const isSpec=()=>G&&idx()<0&&!inWait()&&(G.spec||[]).some(x=>x.id==me.id);
async function enter(mode){
  const nmE=$('nm'),rmE=$('rm');
  if(nmE){me.name=nmE.value.trim()||'Player';code=(rmE.value.trim()||'friends').toLowerCase().replace(/[^a-z0-9]/g,'');ls('tp_n',me.name);ls('tp_r',code)}
  spectate=mode=='spec';
  if(SUPABASE_URL.startsWith('PASTE')){app.innerHTML='<div class="panel">Add your Supabase URL and key at the top of the script in index.html.</div>';return}
  app.innerHTML='<div class="panel">Connecting…</div>';
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  me.id=ls('tp_id')||('p'+Math.random().toString(36).slice(2,10));ls('tp_id',me.id);
  await pull(true);
  if(!G){
    G={phase:'lobby',round:0,cfg:{boot:500,start:1000,max:64000,rAAA:1000,rFace:750,rNum:500,maxBlind:2,turnSecs:40,nextSecs:5,maxPlayers:7},players:[],wait:[],host:me.id,log:[],stake:500,pot:0,turn:0,dealer:-1,side:null};
    const r=await sb.from('rooms').insert({code,state:G,version:0});
    if(r.error)await pull(true);else ver=0;
  }
  if(!spectate&&G&&G.phase!='closed'&&idx()>=0&&G.players[idx()].left){G.players[idx()].left=false;lg(me.name+' is back');await save()}
  if(spectate&&G&&G.phase!='closed'){
    for(let t=0;t<4&&G&&idx()<0&&!inWait()&&!(G.spec||[]).some(x=>x.id==me.id);t++){G.spec=(G.spec||[]).concat([{id:me.id,name:me.name}]);lg(me.name+' is watching');await save()}
  }
  for(let t=0;t<4&&!spectate&&G&&G.phase!='closed'&&idx()<0&&!inWait();t++){
    if(G.cfg.maxPlayers&&G.players.filter(p=>!p.left).length+(G.wait||[]).length>=G.cfg.maxPlayers){
      app.innerHTML='<div class="panel"><div class="gl">Table is full</div><div class="mu">This table allows '+G.cfg.maxPlayers+' players. Ask the host, or try another room code.</div><button class="pri" data-a="spec">Watch instead</button><button data-a="home">Back</button></div>';return}
    G.spec=(G.spec||[]).filter(x=>x.id!=me.id);
    (G.phase=='play'?G.wait:G.players).push({id:me.id,name:me.name,chips:G.cfg.start,buyin:G.cfg.start});
    lg(me.name+' joined');await save();
  }
  render();setInterval(()=>pull(false),1500);
}

/* ---------- game logic ---------- */
function nextTurn(){let i=G.turn;do{i=(i+1)%G.players.length}while(G.players[i].packed);G.turn=i;G.tid=(G.tid||0)+1}
function prevLive(i){let j=i;do{j=(j-1+G.players.length)%G.players.length}while(G.players[j].packed);return j}
function pay(p,c){const sh=Math.max(0,c-p.chips);if(sh){p.chips+=sh;p.buyin+=sh;lg(p.name+' topped up '+sh+' to cover');ev('coin')}p.chips-=c;G.pot+=c}
function transfer(q,h,c){const sh=Math.max(0,c-q.chips);if(sh){q.chips+=sh;q.buyin+=sh;lg(q.name+' topped up '+sh+' to cover');ev('coin')}q.chips-=c;h.chips+=c}
function royAmt(p){const s=score(p.cards),c=G.cfg;if(s[0]!=7)return 0;return s[1]==14?(c.rAAA||0):s[1]>=11?(c.rFace||0):(c.rNum||0)}
function finish(w,sh){
  const p=G.players[w];p.chips+=G.pot;const roy=[];
  G.players.forEach((h,hi)=>{
    const amt=royAmt(h);if(!amt)return;let n=0;
    G.players.forEach((q,qi)=>{if(qi==hi||(sh&&sh.taker==qi&&sh.target==hi))return;transfer(q,h,amt);n++});
    if(n){roy.push({h:hi,amt,n,hn:hname(h.cards)});lg('Royalty: '+h.name+' ('+hname(h.cards)+') collects '+amt+' from '+n)}
  });
  G.result={w,pot:G.pot,show:!!sh,roy};lg(p.name+' wins '+G.pot);G.pot=0;G.phase='over';G.side=null;
}
const rnd=n=>{if(typeof crypto=='undefined'||!crypto.getRandomValues)return Math.floor(Math.random()*n);const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n};
async function deal(auto){
  if(auto){if(G.phase!='over'||G.players.filter(p=>!p.left).length+(G.wait||[]).length<2)return}

}

      <label class="mu">Starting chips<input id="c_start" type="number" value="${d.start}"></label>
      <label class="mu">Max chaal<input id="c_max" type="number" value="${d.max}"></label>
      <label class="mu">Royalty AAA<input id="c_aaa" type="number" value="${d.aaa}"></label>
      <label class="mu">Royalty KKK/QQQ/JJJ<input id="c_face" type="number" value="${d.face}"></label>
      <label class="mu">Royalty number trios<input id="c_num" type="number" value="${d.num}"></label>
      <label class="mu">Max blind turns (0 = no limit)<input id="c_blind" type="number" value="${d.blind}"></label>
      <label class="mu">Turn timer, seconds (0 = off)<input id="c_turn" type="number" value="${d.turn}"></label>
      <label class="mu">Auto next hand, seconds (0 = off)<input id="c_next" type="number" value="${d.next}"></label>
      <label class="mu">Max players at table (2-10)<input id="c_maxp" type="number" value="${d.maxp}"></label></div>
      <div class="mu">Set a royalty to 0 to switch it off.</div><button class="pri" data-a="deal">Deal</button>`;
      return `<div class="mu">Waiting for the host to deal.<br>Boot ${cf.boot} · start ${cf.start} · max chaal ${cf.max}<br>${ry}</div>`;
    }
    return (cf.nextSecs>0?`<div class="gl">Next hand in <span id="nx">${leftNext()}</span>s</div>`:'')+(G.host==me.id?`<button class="pri" data-a="deal">${cf.nextSecs>0?'Deal now':'Next round'}</button>`:(cf.nextSecs>0?'':'<div class="mu">Waiting for the host to deal…</div>'))+`<div class="mu">Boot ${cf.boot} · max chaal ${cf.max}<br>${ry}</div>`;
  }
  if(G.side){
    const s=G.side,b=G.players[s.to];
    if(b.id==me.id)return `<div class="gl">${esc(G.players[s.from].name)} asks for a side show</div><button class="pri" data-a="yes">Accept</button>`;
    return `<div class="mu">Side show: waiting for ${esc(b.name)} to answer…</div>`;
  }
  if(!p)return isSpec()?'<div class="mu">👀 You are watching.</div>':'<div class="mu">You will join next round.</div>';
  if(G.turn!=i)return p.packed?'<div class="mu">You packed. Waiting for the round to finish…</div>':`<div class="mu">Waiting for ${esc(G.players[G.turn].name)}…</div>${p.seen?'':'<button data-a="see">See cards</button>'}`;
  const ti=turnInfo(p),cost=(p.seen?2:1)*G.stake*(ti.triple?3:1),hi=Math.floor(cf.max/2),lo=G.stake+cf.boot,L=live().length;
  const free=!ti.force&&!ti.counter;
  const canRaise=free&&lo<=hi;if(!(rs>=lo&&rs<=hi))rs=lo;
  const canSide=L>=3&&live().every(x=>G.players[x].seen);
  const note=ti.force?(ti.used?'<div class="mu">You already used your counter this round. See your cards'+(L==2?', take a blind show':'')+' or pack.</div>':'<div class="mu">You must see your cards before you can play.</div>'):ti.counter?'<div class="mu">A chaal was played. You can counter (staying blind) or see your cards.</div>':(p.seen&&ti.triple?'<div class="mu">Counter played: chaal is now ×3.</div>':'');
  return `<div class="gl">Your turn</div>${note}${p.seen?'':'<button data-a="see">See cards</button>'}
  ${ti.chaal!=null?`<button class="pri" data-a="chaal">${p.seen?(ti.triple?'Chaal ×3':'Chaal'):'Blind'} ${ti.chaal}</button>`:''}
  ${ti.counter?`<button class="pri" data-a="counter">${ti.label} ${ti.counter}</button>`:''}
  ${L==2?`<button data-a="show">${p.seen?'Show':'Blind show'} ${cost}</button>`:''}
  ${canSide?`<button data-a="side">Side show ${cost}</button>`:''}
  <button class="dng" data-a="pack">Pack</button>
  ${canRaise?`<div class="mu" style="margin-top:8px">Raise stake to <b id="rl">${rs}</b> · you pay <b id="rc">${p.seen?2*rs:rs}</b></div>
  <input type="range" id="rs" min="${lo}" max="${hi}" step="${cf.boot}" value="${rs}"><button data-a="raise">Raise</button>`:''}`;
}
function settleH(){
  return `<details class="panel hf" ${G.phase=='over'?'open':''}><summary>Settle up</summary>${settleBody()}</details>`;
}
function render(){
  if(!G)return;
  tk();renderChat();sndDiff();dealerReact();
  const mi0=idx(),mp0=G.players[mi0],gone0=(G.gone||[]).some(x=>x.id==me.id)&&mi0<0&&!inWait();
  if(G.phase=='closed'||(mp0&&mp0.left)||gone0){app.innerHTML=finalH(G.phase=='closed');return}
  let nd=false;
  if(animRound<0||G.round<animRound)animRound=G.round;
  else if(G.round>animRound&&G.phase=='play'){animRound=G.round;nd=true;dealT=Date.now()}
  if($('c_boot'))draft={boot:+$('c_boot').value,start:+$('c_start').value,max:+$('c_max').value,aaa:+$('c_aaa').value,face:+$('c_face').value,num:+$('c_num').value,blind:+$('c_blind').value,turn:+$('c_turn').value,next:+$('c_next').value,maxp:+$('c_maxp').value};
  const i=idx(),p=G.players[i],play=G.phase=='play',over=G.phase=='over',R=G.result;
  let h=`<div class="table">${dealerH()}<div class="felt"></div><div class="mid"><div class="mu">POT</div><div class="pot">${G.pot}</div>${play?`<div class="mu">stake ${G.stake} · max chaal ${G.cfg.max}</div><div class="mu">Blind ${G.stake} · Seen ${G.stake*2}</div>${G.ctr?`<div class="mu">Last chaal ${G.ctr.C}${G.ctr.n?` · counters ${G.ctr.n}/2 · next chaal ×3`:''}</div>`:''}<div class="gl">▶ ${esc(G.players[G.turn].name)}</div>${G.cfg.turnSecs>0?`<div class="mu">⏱ <span id="tm">${leftSecs()}</span>s</div>`:''}`:''}${over&&R?`<div class="gl">🏆 ${esc(G.players[R.w].name)} wins ${R.pot}</div>${(R.roy||[]).map(r=>`<div class="gl">👑 ${esc(G.players[r.h].name)} ${r.hn}: ${r.amt} × ${r.n}</div>`).join('')}`:''}</div>${seatsH()}</div>`;
  if(p&&p.cards&&(play||over)){
    const show=p.seen||over,hk=G.round+':'+(show?1:0);
    if(show&&hs==G.round+':0')flipT=Date.now();
    hs=hk;
    h+=`<div class="panel"><div class="mu" style="text-align:center">Your cards${show?' · '+hname(p.cards):''}</div><div class="cs">${p.cards.map((c,ci)=>cardH(c,!show,false,ci)).join('')}</div></div>`;
  }
  h+=`<div class="panel" id="ctl">${controls(p,i)}</div>`;
  if(p||(G.wait||[]).some(w=>w.id==me.id)){
    const me_=p||G.wait.find(w=>w.id==me.id);
    h+=`<div class="panel"><div class="gl">Add chips</div><div class="mu">Anytime, even mid-round. Your total buy-in: ${me_.buyin}</div><input id="tu" type="number" placeholder="Amount" value="${esc(tuv)}"><button data-a="topup">Top up</button></div>`;
  }
  if((G.wait||[]).length)h+=`<div class="mu hf">Joining next round: ${G.wait.map(w=>esc(w.name)).join(', ')}</div>`;
  if((G.spec||[]).length)h+=`<div class="mu hf">👀 Watching: ${G.spec.map(w=>esc(w.name)).join(', ')}</div>`;
  if(isSpec())h+=`<div class="panel hf"><button class="pri" data-a="sit">Take a seat</button><button class="dng" data-a="unspec">Stop watching</button></div>`;
  if(G.round)h+=settleH();
  if(p)h+=`<div class="panel hf"><button class="dng" data-a="exit">Exit table</button>${G.host==me.id?`${G.round?'<button class="dng" data-a="reset">Reset game</button>':''}${play?'':'<button class="dng" data-a="close">Close game</button>'}<div class="mu">Close ends the game for everyone and shows who owes whom${play?' (available between rounds)':''}. Reset starts everyone fresh and forgets the settlement.</div>`:''}</div>`;
  h+=`<div class="panel log hf">${G.log.slice(-6).reverse().map(esc).join('<br>')}</div>
  <details class="panel hf"><summary>Hand ranking</summary><div class="mu" style="margin-top:6px">1 Trail (AAA … 222)<br>2 Pure sequence<br>3 Sequence<br>Both sequences: 235 highest, then AKQ, A23, KQJ … 234; same sequence → higher suit of top card<br>4 Colour (compare card by card, then suit)<br>5 Pair (then third card, then suit of the pair’s higher card)<br>6 High card<br>Suits: ♠ › ♥ › ♦ › ♣</div></details>`;
  app.innerHTML=h;just=false;if(nd)dealAnim();dealerLook();
}
document.addEventListener('click',e=>{
  const q=e.target.closest('[data-q]');if(q){$('rxPop').hidden=true;if(G)sendMsg(q.dataset.q,true);return}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a=='rx'){$('rxPop').hidden=!$('rxPop').hidden;return}
  if(a=='mute'){toggleMute();return}
  if(a=='fs'){toggleFs();return}
  if(a=='dealer'){dealerTap();return}
  if(a=='voice'){toggleVoice();return}
  if(a=='join')return enter('join');
  if(a=='spec')return enter('spec');
  if(!G)return;
  if(a=='deal')deal();else if(a=='topup')topup();else if(a=='reset')resetGame();else if(a=='exit')exitGame();else if(a=='close')closeGame();else if(a=='home')location.reload();else if(a=='chat')toggleChat();else if(a=='send')sendChat();else if(a=='sit')sitDown();else if(a=='unspec')stopWatching();else if(a=='share')shareSettle(b);else if(a=='copy')copySettle(b);else if(a=='yes')sideAns(true);else if(a=='no')sideAns(false);
  else if(a=='raise')doAct('raise',rs);else doAct(a);
});
document.addEventListener('input',e=>{
  if(e.target.id=='tu'){tuv=e.target.value;return}
  if(e.target.id!='rs'||!G)return;rs=+e.target.value;const p=G.players[idx()];
  $('rl').textContent=rs;$('rc').textContent=p.seen?2*rs:rs;
});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='chIn')sendChat()});
$('muBtn').textContent=muted?'🔇':'🔊';$('vcBtn').style.opacity=voiceOn?1:.4;
login();
</script></body></html>
