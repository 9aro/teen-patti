<style>

.rxm{display:inline-block;margin:0 8px;font-size:44px;animation:rxf 3s forwards}.rxm small{display:block;font-size:11px;color:var(--mu)}
.rxm.tx{font-size:18px;background:var(--pn);border:1px solid var(--go);border-radius:14px;padding:6px 12px;color:var(--go2)}
@keyframes rxf{0%{opacity:0;transform:translateY(10px)}10%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-50px)}}
#app .seat{transition:none}
.bub{position:fixed;transform:translate(-50%,-100%);max-width:210px;background:#f7f2e4;color:#16161a;padding:6px 10px;border-radius:12px;font-size:13px;line-height:1.25;z-index:60;pointer-events:none;box-shadow:0 4px 14px #000a;animation:bub 4s forwards;word-break:break-word}

#toast.on{opacity:1}

<script>
const SUPABASE_URL='https://xshnochrinvblixkhiny.supabase.co',SUPABASE_KEY='sb_publishable_RnWG0MJ3dEBOzl1Hfib51Q_WqwcwF7R';
const FN=SUPABASE_URL+'/functions/v1/game';
const SU=['♣','♦','♥','♠'],RN={11:'J',12:'Q',13:'K',14:'A'},rn=r=>RN[r]||r;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Only used to NAME a hand on screen. The server does all the real scoring and dealing.
function score(h){
  const c=h.slice().sort((a,b)=>b[0]-a[0]||b[1]-a[1]),r=c.map(x=>x[0]),top=c[0][1];
  const flush=c.every(x=>x[1]==top);
  if(r[0]==r[2])return[7,r[0]];
  let seq=null;
  if(r[0]==5&&r[1]==3&&r[2]==2)seq=1000;
  else if(r[0]==14&&r[1]==3&&r[2]==2)seq=13.5;
  else if(r[0]-r[1]==1&&r[1]-r[2]==1)seq=r[0];
  if(flush&&seq!==null)return[6,seq,top];
  if(seq!==null)return[5,seq,top];
  if(flush)return[4,...r,top];
  if(r[0]==r[1]||r[1]==r[2])return[3];
  return[2];
}
const hname=h=>['','','High card','Pair','Colour','Sequence','Pure sequence','Trail'][score(h)[0]];

const $=id=>document.getElementById(id),app=$('app');
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
let G=null,me={id:null,name:''},sb,code,ver=-1,hand=null,rs=0,draft=null,tuv='',flipT=0,dealT=0,hs='',animRound=-1;
let busy=false,skew=null,lastKey=null,fails=0,fbN=0,started=false,spectate=false;
const idx=()=>G.players.findIndex(p=>p.id==me.id),inWait=()=>(G.wait||[]).some(p=>p.id==me.id);
const live=()=>G.players.map((p,i)=>i).filter(i=>!G.players[i].packed);
const cardH=(c,hide,sm,ci=0)=>{
  const now=Date.now();
  if(hide){const dl=!sm&&now<dealT+1500;return `<div class="c bk ${sm?'sm':''} ${dl?'dl':''}" ${dl?`style="animation-delay:${(0.5+ci*0.12-(now-dealT)/1000).toFixed(2)}s"`:''}></div>`}
  const red=c[1]==2||c[1]==3?'r':'',txt=rn(c[0])+'<span>'+SU[c[1]-1]+'</span>';
  if(sm||now>=flipT+900)return `<div class="c ${red} ${sm?'sm':''}">${txt}</div>`;
  return `<div class="fc" style="animation-delay:${(ci*0.12-(now-flipT)/1000).toFixed(2)}s"><div class="c ${red}">${txt}</div><div class="c bk bsd"></div></div>`;
};

/* ---------- talking to the server ---------- */
let toastT=0;
function toast(m,long){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),long?5000:2500)}
async function token(){
  let s=await sb.auth.getSession();
  if(!s.data.session){const a=await sb.auth.signInAnonymously();if(a.error)throw a.error;s=await sb.auth.getSession()}
  return s.data.session.access_token;
}
// One request to the "game" function. Always resolves with {ok, state, version, mine, error...}
async function call(action,extra,again){
  let res,r;
  try{
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),15000);
    try{
      r=await fetch(FN,{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY,Authorization:'Bearer '+await token()},body:JSON.stringify({...(extra||{}),code,name:me.name,action})});
      res=await r.json();
    }finally{clearTimeout(to)}
  }catch(e){return{ok:false,net:true,error:'Connection problem. Check your internet and try again.'}}
  if(!res||res.ok===undefined)return{ok:false,error:(res&&(res.message||res.msg))||'Server error ('+(r?r.status:'?')+')'};
  if(res.auth&&!again){try{await sb.auth.refreshSession()}catch(e){}return call(action,extra,true)}
  return res;
}
// Server clock vs this phone's clock: the smallest gap seen when a turn just changed
function evTime(){return G.phase=='play'?(G.turnAt||0):G.phase=='over'?(G.nextAt||0)-(G.cfg.nextSecs||0)*1000:0}
function sample(){const t=evTime();if(!t)return;const d=Date.now()-t;skew=skew===null?d:Math.min(skew,d)}
function elapsed(){const t=evTime();return t?Math.max(0,(Date.now()-t-(skew||0))/1000):0}
const leftNext=()=>Math.max(0,Math.ceil((G.cfg.nextSecs||0)-elapsed()));
const leftSecs=()=>Math.max(0,Math.ceil((G.cfg.turnSecs||0)-elapsed()));
// Take in a server answer (only if it is not older than what we already show)
function apply(res){
  if(!res)return;
  let ch=false;
  if(res.state&&res.version!=null&&res.version>=ver&&(res.version!==ver||!G)){
    if(G&&res.state.round<G.round)hand=null; // game was reset
    const key=res.state.round+':'+(res.state.tid||0)+':'+res.state.phase,first=lastKey===null;
    G=res.state;ver=res.version;ch=true;
    if(!first&&key!==lastKey)sample();
    lastKey=key;
  }
  if(res.mine&&JSON.stringify(res.mine)!==JSON.stringify(hand)&&(!hand||res.mine.round>=hand.round||(G&&G.round<hand.round))){hand=res.mine;ch=true}
  if(ch)render();
}
// A player action: one at a time, answer applied straight away
async function act(a,extra){
  if(busy)return{ok:false};
  busy=true;document.body.classList.add('busy');
  try{const res=await call(a,extra);if(!res.ok&&res.error)toast(res.error,res.alert);apply(res);return res}
  finally{busy=false;document.body.classList.remove('busy')}
}
const doAct=(a,v)=>act(a,v===undefined?{}:{v});
// Read the public table state (it holds no cards). If that ever fails, ask the function instead.
let pollBusy=false;
async function poll(){
  if(pollBusy||!G)return;pollBusy=true;
  try{
    if(fails<3){
      const r=await sb.from('rooms').select('state,version').eq('code',code).maybeSingle();
      if(r.error||!r.data)fails++;else{fails=0;apply({state:r.data.state,version:r.data.version})}
    }else{apply(await call('tick'));if(++fbN%20==0)fails=0}
  }catch(e){fails++}
  pollBusy=false;
}
// My own cards come only from the server, and only after I have looked (or the round is over)
let cardsBusy=false,cardsNext=0,cardTry={r:-1,n:0};
function needCards(){
  if(!G||idx()<0)return false;const p=G.players[idx()];
  if(!p||p.rd!==G.round||(hand&&hand.round===G.round))return false;
  return(G.phase=='play'&&p.seen)||G.phase=='over';
}
function ensureCards(){
  if(cardsBusy||Date.now()<cardsNext||!needCards())return;
  if(cardTry.r!==G.round)cardTry={r:G.round,n:0};
  if(++cardTry.n>8)return;
  cardsBusy=true;cardsNext=Date.now()+2500;
  call('cards').then(apply).finally(()=>{cardsBusy=false});
}
// When a timer has run out, nudge the server. It only acts if the time really is up.
let tickBusy=false,tickNext=0,tickJ=Math.random(),tickN=-1;
function maybeTick(){
  if(tickBusy||Date.now()<tickNext)return;
  let due=false;
  if(G.phase=='play'&&G.cfg.turnSecs>0){
    const cur=G.players[G.turn],mineT=cur&&cur.id==me.id;
    due=elapsed()>=G.cfg.turnSecs+(mineT?0.5:2+tickJ);
  }else if(G.phase=='over'&&G.cfg.nextSecs>0&&G.players.filter(p=>!p.left).length+(G.wait||[]).length>=2){
    due=elapsed()>=G.cfg.nextSecs+(G.host==me.id?0.5:2+tickJ);
  }
  if(!due)return;
  tickBusy=true;tickNext=Date.now()+3000;
  call('tick').then(apply).finally(()=>{tickBusy=false});
}

/* ---------- join ---------- */
function login(){
  app.innerHTML=`<div class="panel"><div class="gl">Join a table</div>
  <input id="nm" placeholder="Your name" maxlength="14" value="${esc(ls('tp_n')||'')}">
  <input id="rm" placeholder="Room code (any word, share with friends)" maxlength="20" value="${esc(ls('tp_r')||'')}">
  <button class="pri" data-a="join">Join game</button><button data-a="spec">Spectate</button></div>`;
}
const isSpec=()=>G&&idx()<0&&!inWait()&&(G.spec||[]).some(x=>x.id==me.id);
async function enter(mode){
  const nmE=$('nm'),rmE=$('rm');
  if(nmE){me.name=nmE.value.trim()||'Player';code=(rmE.value.trim()||'friends').toLowerCase().replace(/[^a-z0-9]/g,'');ls('tp_n',me.name);ls('tp_r',code)}
  spectate=mode=='spec';
  if(SUPABASE_URL.startsWith('PASTE')){app.innerHTML='<div class="panel">Add your Supabase URL and key at the top of the script in index.html.</div>';return}
  app.innerHTML='<div class="panel">Connecting…</div>';
  if(!sb)sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  try{await token()}catch(e){app.innerHTML='<div class="panel"><div class="gl">Sign-in failed</div><div class="mu">'+esc(e.message||e)+'</div><button data-a="home">Back</button></div>';return}
  // The player id is the sign-in id, so the server knows who is who
  me.id=(await sb.auth.getSession()).data.session.user.id;
  const res=await call('join',{spectate});
  if(res.full){app.innerHTML='<div class="panel"><div class="gl">Table is full</div><div class="mu">This table is full. Ask the host, or try another room code.</div><button class="pri" data-a="spec">Watch instead</button><button data-a="home">Back</button></div>';return}
  if(!res.state){app.innerHTML='<div class="panel"><div class="gl">Could not join</div><div class="mu">'+esc(res.error||'Unknown error')+'</div><button data-a="home">Back</button></div>';return}
  apply(res);
  if(!started){started=true;setInterval(poll,1500)}
}

/* ---------- game logic helpers (display only; the server decides everything) ---------- */
function turnInfo(p){
  const S=G.stake,cf=G.cfg,ct=G.ctr,lim=cf.maxBlind||0,triple=!!(ct&&ct.n>=1);
  if(p.seen)return{chaal:2*S*(triple?3:1),triple};
  const capHit=lim>0&&(p.blinds||0)>=lim;
  if(ct){
    if(!capHit&&!p.countered&&ct.n<2&&3*ct.C<=cf.max)return{counter:ct.C,label:ct.n?'Counter pass':'Counter',triple};
    return{force:true,triple,used:!!p.countered};
  }
  if(capHit)return{force:true};
  return{chaal:S};
}
async function deal(){
  const x={};

function nets(){
  const m={},add=x=>{const e=m[x.id]||(m[x.id]={id:x.id,name:x.name,chips:0,buyin:0});e.name=x.name;e.chips+=x.chips;e.buyin+=x.buyin};
  (G.gone||[]).forEach(add);G.players.forEach(add);(G.wait||[]).forEach(add);
  return Object.values(m).map(e=>({...e,net:e.chips-e.buyin})).sort((a,b)=>b.net-a.net);
}
function owes(rows){
  const d=rows.filter(r=>r.net<0).map(r=>({n:r.name,a:-r.net})).sort((a,b)=>b.a-a.a),c=rows.filter(r=>r.net>0).map(r=>({n:r.name,a:r.net})).sort((a,b)=>b.a-a.a),out=[];
  let i=0,j=0;
  while(i<d.length&&j<c.length){const x=Math.min(d[i].a,c[j].a);out.push([d[i].n,c[j].n,x]);d[i].a-=x;c[j].a-=x;if(d[i].a<=0)i++;if(c[j].a<=0)j++}
  return out;
}

function tone(f,d,type='sine',g=0.3,when=0,to=null){

function noise(d,g=0.3,f=3000,when=0,q=1,type='bandpass',to=null){

  s.buffer=NB;fl.type=type;fl.frequency.setValueAtTime(f,t);fl.Q.value=q;if(to)fl.frequency.exponentialRampToValueAtTime(to,t+d);

    return (cf.nextSecs>0?`<div class="gl">${G.closeAfter?'Game closes in':'Next hand in'} <span id="nx">${leftNext()}</span>s</div>`:'')+(G.host==me.id?`<button class="pri" data-a="deal">${G.closeAfter?'Close game now':cf.nextSecs>0?'Deal now':'Next round'}</button>`:(cf.nextSecs>0?'':'<div class="mu">Waiting for the host to deal…</div>'))+`<div class="mu">Boot ${cf.boot} · max chaal ${cf.max}<br>${ry}</div>`;
  }
  if(!p)return isSpec()?'<div class="mu">👀 You are watching.</div>':'<div class="mu">You will join next round.</div>';
  if(p.exitPending)return '<div class="mu">You will be exited when this round ends, so balances are settled…</div>';
  if(G.turn!=i)return p.packed?'<div class="mu">You packed. Waiting for the round to finish…</div>':`<div class="mu">Waiting for ${esc(G.players[G.turn].name)}…</div>${p.seen?'':'<button data-a="see">See cards</button>'}`;
  const ti=turnInfo(p),cost=(p.seen?2:1)*G.stake*(ti.triple?3:1),hi=Math.floor(cf.max/2),lo=G.stake+cf.boot,L=live().length;
  const free=!ti.force&&!ti.counter;
  const canRaise=free&&lo<=hi;if(!(rs>=lo&&rs<=hi))rs=lo;
  const canSide=L>=3&&live().every(x=>G.players[x].seen);
  const note=ti.force?(ti.used?'<div class="mu">You already used your counter this round. See your cards'+(L==2?', take a blind show':'')+' or pack.</div>':'<div class="mu">You must see your cards before you can play.</div>'):ti.counter?'<div class="mu">A chaal was played. You can counter (staying blind) or see your cards.</div>':(p.seen&&ti.triple?'<div class="mu">Counter played: chaal is now ×3.</div>':'');
  return `<div class="gl">Your turn</div>${note}${p.seen?'':'<button data-a="see">See cards</button>'}
  ${ti.chaal!=null?`<button class="pri" data-a="chaal">${p.seen?(ti.triple?'Chaal ×3':'Chaal'):'Blind'} ${ti.chaal}</button>`:''}
  ${ti.counter?`<button class="pri" data-a="counter">${ti.label} ${ti.counter}</button>`:''}
  ${L==2?`<button data-a="show">${p.seen?'Show':'Blind show'} ${cost}</button>`:''}
  ${canSide?`<button data-a="side">Side show ${cost}</button>`:''}
  <button class="dng" data-a="pack">Pack</button>
  ${canRaise?`<div class="mu" style="margin-top:8px">Raise stake to <b id="rl">${rs}</b> · you pay <b id="rc">${p.seen?2*rs:rs}</b></div>
  <input type="range" id="rs" min="${lo}" max="${hi}" step="${cf.boot}" value="${rs}"><button data-a="raise">Raise</button>`:''}`;
}
function settleH(){
  return `<details class="panel hf" ${G.phase=='over'?'open':''}><summary>Settle up</summary>${settleBody()}</details>`;
}
let ovPrev=null;
// Overlay for everyone when a round ends in a show: lasts (next hand timer - 1) seconds, 3s if the timer is off
function showOverlay(){
  const R=G.result,rv=(R&&R.reveal)||{},ps=G.players.map((q,i)=>i).filter(i=>!G.players[i].packed&&rv[G.players[i].id]);
  if(!R||ps.length<2)return;
  const old=$('ovShow');if(old)old.remove();
  const d=document.createElement('div');d.id='ovShow';d.className='ov';
  d.innerHTML=`<div class="ovb"><div class="gl">Show</div>${ps.map(i=>{const q=G.players[i],cs=rv[q.id],w=i==R.w;return `<div class="ovr ${w?'win':''}"><div>${w?'🏆 ':''}<b>${esc(q.name)}</b> · ${hname(cs)}${w?' · wins '+R.pot:''}</div><div class="cs">${cs.map(c=>cardH(c,false,false)).join('')}</div></div>`}).join('')}</div>`;
  const ns=G.cfg.nextSecs||0,ms=ns>0?Math.max(1,ns-1)*1000:3000;
  document.body.appendChild(d);setTimeout(()=>d.remove(),ms);
}
function render(){
  if(!G)return;
  renderChat();sndDiff();
  const mi0=idx(),mp0=G.players[mi0],gone0=(G.gone||[]).some(x=>x.id==me.id)&&mi0<0&&!inWait();
  if(G.phase=='closed'||(mp0&&mp0.left)||gone0){app.innerHTML=finalH(G.phase=='closed');return}
  if(ovPrev=='play'&&G.phase=='over'&&G.result&&G.result.show)showOverlay();
  ovPrev=G.phase;
  let nd=false;
  if(animRound<0||G.round<animRound)animRound=G.round;
  else if(G.round>animRound&&G.phase=='play'){animRound=G.round;nd=true;dealT=Date.now()}
  if($('c_boot'))draft={boot:+$('c_boot').value,start:+$('c_start').value,max:+$('c_max').value,aaa:+$('c_aaa').value,face:+$('c_face').value,num:+$('c_num').value,blind:+$('c_blind').value,turn:+$('c_turn').value,next:+$('c_next').value,maxp:+$('c_maxp').value};
  const i=idx(),p=G.players[i],play=G.phase=='play',over=G.phase=='over',R=G.result;
  let h=`<div class="table">${dealerH()}<div class="felt"></div><div class="mid"><div class="mu">POT</div><div class="pot">${G.pot}</div>${play?`<div class="mu">stake ${G.stake} · max chaal ${G.cfg.max}</div><div class="mu">Blind ${G.stake} · Seen ${G.stake*2}</div>${G.ctr?`<div class="mu">Last chaal ${G.ctr.C}${G.ctr.n?` · counters ${G.ctr.n}/2 · next chaal ×3`:''}</div>`:''}<div class="gl">▶ ${esc(G.players[G.turn].name)}</div>${G.cfg.turnSecs>0?`<div class="mu">⏱ <span id="tm">${leftSecs()}</span>s</div>`:''}`:''}${over&&R?`<div class="gl">🏆 ${esc(G.players[R.w].name)} wins ${R.pot}</div>${(R.roy||[]).map(r=>`<div class="gl">👑 ${esc(G.players[r.h].name)} ${r.hn}: ${r.amt} × ${r.n}</div>`).join('')}`:''}</div>${seatsH()}</div>`;
  if(p&&p.rd===G.round&&(play||over)){
    const mc=hand&&hand.round===G.round?hand.cards:null,show=!!mc&&(p.seen||over),hk=G.round+':'+(show?1:0);
    if(show&&hs==G.round+':0')flipT=Date.now();
    hs=hk;
    h+=`<div class="panel"><div class="mu" style="text-align:center">Your cards${show?' · '+hname(mc):''}</div><div class="cs">${[0,1,2].map(ci=>cardH(show?mc[ci]:null,!show,false,ci)).join('')}</div></div>`;
  }
  if(G.closeAfter&&G.phase!='closed')h+=`<div class="mu" style="text-align:center">🔒 The game will close after this round</div>`;
  h+=`<div class="panel" id="ctl">${controls(p,i)}</div>`;
  if(p||(G.wait||[]).some(w=>w.id==me.id)){
    const me_=p||G.wait.find(w=>w.id==me.id);
    h+=`<div class="panel"><div class="gl">Add chips</div><div class="mu">Anytime, even mid-round. Your total buy-in: ${me_.buyin}</div><input id="tu" type="number" placeholder="Amount" value="${esc(tuv)}"><button data-a="topup">Top up</button></div>`;
  }
  if((G.wait||[]).length)h+=`<div class="mu hf">Joining next round: ${G.wait.map(w=>esc(w.name)).join(', ')}</div>`;
  if((G.spec||[]).length)h+=`<div class="mu hf">👀 Watching: ${G.spec.map(w=>esc(w.name)).join(', ')}</div>`;
  if(isSpec())h+=`<div class="panel hf"><button class="pri" data-a="sit">Take a seat</button><button class="dng" data-a="unspec">Stop watching</button></div>`;
  if(G.round)h+=settleH();
  if(p)h+=`<div class="panel hf"><button class="dng" data-a="exit">Exit table</button>${G.host==me.id?`${G.round?'<button class="dng" data-a="reset">Reset game</button>':''}${play?`<button class="dng" data-a="closeafter">${G.closeAfter?'Cancel close after this round':'Close after this round'}</button>`:'<button class="dng" data-a="close">Close game</button>'}<div class="mu">Close ends the game for everyone and shows who owes whom${play?'. During a round it closes the game as soon as the round ends':''}. Reset starts everyone fresh and forgets the settlement.</div>`:''}</div>`;
  h+=`<div class="panel log hf">${G.log.slice(-6).reverse().map(esc).join('<br>')}</div>
  <details class="panel hf"><summary>Hand ranking</summary><div class="mu" style="margin-top:6px">1 Trail (AAA … 222)<br>2 Pure sequence<br>3 Sequence<br>Both sequences: 235 highest, then AKQ, A23, KQJ … 234; same sequence → higher suit of top card<br>4 Colour (compare card by card, then suit)<br>5 Pair (then third card, then suit of the pair’s higher card)<br>6 High card<br>Suits: ♠ › ♥ › ♦ › ♣</div></details>`;
  app.innerHTML=h;if(nd)dealAnim();
  ensureCards();
}
document.addEventListener('click',e=>{
  const q=e.target.closest('[data-q]');if(q){$('rxPop').hidden=true;if(G)sendMsg(q.dataset.q,true);return}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a=='rx'){$('rxPop').hidden=!$('rxPop').hidden;return}
  if(a=='mute'){toggleMute();return}
  if(a=='fs'){toggleFs();return}
  if(a=='join')return enter('join');
  if(a=='spec')return enter('spec');
  if(a=='home'){location.reload();return}
  if(!G)return;
  if(a=='deal')deal();else if(a=='topup')topup();else if(a=='reset')resetGame();else if(a=='exit')exitGame();else if(a=='close')closeGame();else if(a=='closeafter')closeAfterToggle();else if(a=='chat')toggleChat();else if(a=='send')sendChat();else if(a=='sit')sitDown();else if(a=='unspec')stopWatching();else if(a=='share')shareSettle(b);else if(a=='copy')copySettle(b);
  else if(a=='raise')doAct('raise',rs);else doAct(a);
});
document.addEventListener('input',e=>{
  if(e.target.id=='tu'){tuv=e.target.value;return}
  if(e.target.id!='rs'||!G)return;rs=+e.target.value;const p=G.players[idx()];
  $('rl').textContent=rs;$('rc').textContent=p.seen?2*rs:rs;
});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='chIn')sendChat()});
$('muBtn').textContent=muted?'🔇':'🔊';
login();
</script></body></html>
