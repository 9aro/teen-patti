<style>

<script>
const SUPABASE_URL='https://xshnochrinvblixkhiny.supabase.co',SUPABASE_KEY='sb_publishable_RnWG0MJ3dEBOzl1Hfib51Q_WqwcwF7R';
const SU=['♣','♦','♥','♠'],RN={11:'J',12:'Q',13:'K',14:'A'},rn=r=>RN[r]||r;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Hand scoring: arrays compared left to right. Suits: spade 4 > heart 3 > diamond 2 > club 1.
function score(h){
  const c=h.slice().sort((a,b)=>b[0]-a[0]||b[1]-a[1]),r=c.map(x=>x[0]),top=c[0][1];
  const flush=c.every(x=>x[1]==top);
  if(r[0]==r[2])return[7,r[0]];
  let seq=null;
  if(r[0]==5&&r[1]==3&&r[2]==2)seq=1000;            // 235 is the top sequence
  else if(r[0]==14&&r[1]==3&&r[2]==2)seq=13.5;       // A23 sits just below AKQ
  else if(r[0]-r[1]==1&&r[1]-r[2]==1)seq=r[0];       // AKQ=14 ... 432=4
  if(flush&&seq!==null)return[6,seq,top];
  if(seq!==null)return[5,seq,top];
  if(flush)return[4,...r,top];
  if(r[0]==r[1]||r[1]==r[2]){const pc=c.filter(x=>x[0]==r[1]);return[3,r[1],r[0]==r[1]?r[2]:r[0],Math.max(...pc.map(x=>x[1]))];}
  return[2,...r,top];
}
const cmp=(a,b)=>{for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0};
const hname=h=>['','','High card','Pair','Colour','Sequence','Pure sequence','Trail'][score(h)[0]];

const $=id=>document.getElementById(id),app=$('app');
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
let G=null,me={id:null,name:''},sb,code,ver=-1,just=false,rs=0,draft=null,tuv='';
const idx=()=>G.players.findIndex(p=>p.id==me.id),inWait=()=>(G.wait||[]).some(p=>p.id==me.id);
const live=()=>G.players.map((p,i)=>i).filter(i=>!G.players[i].packed);
const lg=s=>{G.log.push(s);if(G.log.length>30)G.log.shift()};
const cardH=(c,hide,sm)=>hide?`<div class="c bk ${sm?'sm':''}"></div>`:`<div class="c ${c[1]==2||c[1]==3?'r':''} ${sm?'sm':''} ${just&&!sm?'fl':''}">${rn(c[0])}<span>${SU[c[1]-1]}</span></div>`;

/* ---------- database ---------- */
async function save(){
  render();
  const r=await sb.from('rooms').update({state:G,version:ver+1}).eq('code',code).eq('version',ver).select('version');
  if(r.error){alert('Save failed: '+r.error.message);return false}
  if(!r.data.length){await pull(true);return false}
  ver=r.data[0].version;return true;
}
async function pull(force){
  const r=await sb.from('rooms').select('state,version').eq('code',code).maybeSingle();
  if(r.error||!r.data)return;
  if(force||r.data.version!==ver){G=r.data.state;ver=r.data.version;render()}
}
function login(){
  app.innerHTML=`<div class="panel"><div class="gl">Join a table</div>
  <input id="nm" placeholder="Your name" maxlength="14" value="${esc(ls('tp_n')||'')}">
  <input id="rm" placeholder="Room code (any word, share with friends)" maxlength="20" value="${esc(ls('tp_r')||'')}">
  <button class="pri" data-a="join">Join</button></div>`;
}
async function enter(){
  me.name=$('nm').value.trim()||'Player';
  code=($('rm').value.trim()||'friends').toLowerCase().replace(/[^a-z0-9]/g,'');
  ls('tp_n',me.name);ls('tp_r',code);
  if(SUPABASE_URL.startsWith('PASTE')){app.innerHTML='<div class="panel">Add your Supabase URL and key at the top of the script in index.html.</div>';return}
  app.innerHTML='<div class="panel">Connecting…</div>';
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  me.id=ls('tp_id')||('p'+Math.random().toString(36).slice(2,10));ls('tp_id',me.id);
  await pull(true);
  if(!G){
    G={phase:'lobby',round:0,cfg:{boot:10,start:1000,max:1280,rAAA:1500,rFace:1000,rNum:500,maxBlind:4,turnSecs:0},players:[],wait:[],host:me.id,log:[],stake:10,pot:0,turn:0,dealer:-1,side:null};
    const r=await sb.from('rooms').insert({code,state:G,version:0});
    if(r.error)await pull(true);else ver=0;
  }
  if(G&&G.phase!='closed'&&idx()>=0&&G.players[idx()].left){G.players[idx()].left=false;lg(me.name+' is back');await save()}
  for(let t=0;t<4&&G&&G.phase!='closed'&&idx()<0&&!inWait();t++){
    (G.phase=='play'?G.wait:G.players).push({id:me.id,name:me.name,chips:G.cfg.start,buyin:G.cfg.start});
    lg(me.name+' joined');await save();
  }
  render();setInterval(()=>pull(false),1500);
}

/* ---------- game logic ---------- */
function nextTurn(){let i=G.turn;do{i=(i+1)%G.players.length}while(G.players[i].packed);G.turn=i;G.tid=(G.tid||0)+1}
function prevLive(i){let j=i;do{j=(j-1+G.players.length)%G.players.length}while(G.players[j].packed);return j}
function pay(p,c){const sh=Math.max(0,c-p.chips);if(sh){p.chips+=sh;p.buyin+=sh;lg(p.name+' topped up '+sh+' to cover')}p.chips-=c;G.pot+=c}
function transfer(q,h,c){const sh=Math.max(0,c-q.chips);if(sh){q.chips+=sh;q.buyin+=sh;lg(q.name+' topped up '+sh+' to cover')}q.chips-=c;h.chips+=c}
function royAmt(p){const s=score(p.cards),c=G.cfg;if(s[0]!=7)return 0;return s[1]==14?(c.rAAA||0):s[1]>=11?(c.rFace||0):(c.rNum||0)}
function finish(w,sh){
  const p=G.players[w];p.chips+=G.pot;const roy=[];
  G.players.forEach((h,hi)=>{
    const amt=royAmt(h);if(!amt)return;let n=0;
    G.players.forEach((q,qi)=>{if(qi==hi||(sh&&sh.taker==qi&&sh.target==hi))return;transfer(q,h,amt);n++});
    if(n){roy.push({h:hi,amt,n,hn:hname(h.cards)});lg('Royalty: '+h.name+' ('+hname(h.cards)+') collects '+amt+' from '+n)}
  });
  G.result={w,pot:G.pot,show:!!sh,roy};lg(p.name+' wins '+G.pot);G.pot=0;G.phase='over';G.side=null;
}
const rnd=n=>{if(typeof crypto=='undefined'||!crypto.getRandomValues)return Math.floor(Math.random()*n);const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n};
async function deal(){
  if(G.host!=me.id)return;
  G.gone=(G.gone||[]).concat(G.players.filter(p=>p.left).map(p=>({id:p.id,name:p.name,chips:p.chips,buyin:p.buyin})));
  G.players=G.players.filter(p=>!p.left);G.dealer=Math.max(-1,Math.min(G.dealer,G.players.length-1));
  if(G.phase=='lobby'){
    const c={boot:+$('c_boot').value,start:+$('c_start').value,max:+$('c_max').value,rAAA:+$('c_aaa').value,rFace:+$('c_face').value,rNum:+$('c_num').value,maxBlind:+$('c_blind').value,turnSecs:+$('c_turn').value};
    if(!(c.boot>0&&c.start>0&&c.max>=2*c.boot&&c.rAAA>=0&&c.rFace>=0&&c.rNum>=0&&c.maxBlind>=0&&c.turnSecs>=0)){alert('Check settings: max chaal must be at least 2 × boot.');return}
    G.cfg=c;draft=null;
    if(!G.round)G.players.forEach(p=>{p.chips=p.buyin=c.start});
  }
  G.players.push(...(G.wait||[]));G.wait=[];
  if(G.players.length<2){alert('Need at least 2 players.');return}
  const d=[];for(let r=2;r<=14;r++)for(let s=1;s<=4;s++)d.push([r,s]);
  for(let i=d.length-1;i>0;i--){const j=rnd(i+1);[d[i],d[j]]=[d[j],d[i]]}
  G.pot=0;
  G.players.forEach(p=>{p.cards=[d.pop(),d.pop(),d.pop()];p.seen=false;p.packed=false;p.blinds=0;p.last='Boot '+G.cfg.boot;pay(p,G.cfg.boot)});
  G.dealer=(G.dealer+1)%G.players.length;G.turn=G.dealer;nextTurn();
  G.ctr=null;G.stake=G.cfg.boot;G.round++;G.phase='play';G.result=null;G.side=null;
  lg('Round '+G.round+' – boot '+G.cfg.boot+' each');await save();
}
function turnInfo(p){
  const S=G.stake,cf=G.cfg,ct=G.ctr,lim=cf.maxBlind||0,triple=!!(ct&&ct.n>=1);
  if(p.seen)return{chaal:2*S*(triple?3:1),triple};
  const capHit=lim>0&&(p.blinds||0)>=lim;
  if(ct){
    if(!capHit&&ct.n<2&&3*ct.C<=cf.max)return{counter:ct.C,label:ct.n?'Counter pass':'Counter',triple};
    return{force:true,triple};
  }
  if(capHit)return{force:true};
  return{chaal:S};
}
async function doAct(t,v){
  const i=G.turn,p=G.players[i];
  if(G.phase!='play'||p.id!=me.id||G.side)return;
  const triple=!!(G.ctr&&G.ctr.n>=1),seenChaal=2*G.stake*(triple?3:1),cost=p.seen?seenChaal:seenChaal/2;
  if(t=='see'){p.seen=true;just=true}
  else if(t=='pack'){p.packed=true;p.last='Packed';lg(p.name+' packed');live().length==1?finish(live()[0],null):nextTurn()}
  else if(t=='chaal'){const ti=turnInfo(p);if(ti.chaal==null)return;const c=ti.chaal;
    if(p.seen){if(ti.triple)G.stake*=3;p.last=(ti.triple?'Chaal ×3 ':'Chaal ')+c;pay(p,c);lg(p.name+' chaal '+c+(ti.triple?' (×3)':''));G.ctr={C:c,n:0}}
    else{p.blinds=(p.blinds||0)+1;p.last='Blind '+c;pay(p,c);lg(p.name+' blind '+c)}
    nextTurn()}
  else if(t=='counter'){const ti=turnInfo(p);if(!ti.counter)return;pay(p,ti.counter);p.blinds=(p.blinds||0)+1;p.last=ti.label+' '+ti.counter;lg(p.name+' '+ti.label.toLowerCase()+' '+ti.counter);G.ctr.n++;nextTurn()}
  else if(t=='raise'){const ti1=turnInfo(p);if(ti1.force||ti1.counter)return;const S=+v,c=p.seen?2*S:S;if(!(S>G.stake&&S<=Math.floor(G.cfg.max/2)))return;G.stake=S;p.last='Raise '+c;if(!p.seen)p.blinds=(p.blinds||0)+1;G.ctr=p.seen?{C:c,n:0}:null;pay(p,c);lg(p.name+' raised, stake '+S+' (paid '+c+')');nextTurn()}
  else if(t=='show'){if(live().length!=2)return;const o=live().find(x=>x!=i);p.last='Show '+cost;pay(p,cost);lg(p.name+' asked for a show');finish(cmp(score(p.cards),score(G.players[o].cards))>0?i:o,{taker:i,target:o})}
  else if(t=='side'){const ti3=turnInfo(p);if(ti3.force||ti3.counter)return;const o=prevLive(i);if(live().length<3||!p.seen||!G.players[o].seen)return;G.ctr=null;if(triple)G.stake*=3;p.last='Side show '+cost;pay(p,cost);G.side={from:i,to:o};G.tid=(G.tid||0)+1;lg(p.name+' asks '+G.players[o].name+' for a side show')}
  await save();
}
async function sideAns(ok){
  const s=G.side;if(!s||G.players[s.to].id!=me.id)return;
  const a=G.players[s.from],b=G.players[s.to];G.turn=s.from;G.side=null;
  if(ok){const lo=cmp(score(a.cards),score(b.cards))>0?b:a;lo.packed=true;lo.last='Packed (side show)';lg('Side show: '+a.name+' vs '+b.name+' – '+lo.name+' packed')}
  else{b.last='Declined side show';lg(b.name+' declined the side show')}
  live().length==1?finish(live()[0],null):nextTurn();
  await save();
}
async function topup(){
  const v=Math.floor(+tuv);if(!(v>0))return;
  for(let t=0;t<4;t++){
    const p=G.players.find(x=>x.id==me.id)||(G.wait||[]).find(x=>x.id==me.id);if(!p)return;
    p.chips+=v;p.buyin+=v;lg(p.name+' added '+v);
    if(await save()){tuv='';render();return}
  }
}

async function resetGame(){
  if(G.host!=me.id)return;
  if(!confirm('Reset the game? Everyone goes back to the starting chips and all earlier settlement is forgotten. To end the game and see who owes whom, use Close game instead.'))return;
  for(let t=0;t<4;t++){
    G.players.push(...(G.wait||[]));G.wait=[];G.players=G.players.filter(p=>!p.left);G.gone=[];
    G.players.forEach(p=>{p.chips=p.buyin=G.cfg.start;p.cards=null;p.seen=false;p.packed=false});
    Object.assign(G,{phase:'lobby',round:0,pot:0,stake:G.cfg.boot,turn:0,dealer:-1,side:null,result:null,log:['Game reset by '+me.name]});
    if(await save())return;
  }
}

/* ---------- exit, close, settlement ---------- */
async function exitGame(){
  if(idx()<0)return;
  if(!confirm('Leave the table? Your hand is packed and you will see who owes whom.'))return;
  for(let t=0;t<4;t++){
    const j=idx();if(j<0||G.players[j].left)break;
    const p=G.players[j],s=G.side,wasTurn=G.phase=='play'&&G.turn==j&&!s;
    p.left=true;p.last='Left';lg(p.name+' left the table');
    if(G.host==p.id){const nh=G.players.find(x=>!x.left);if(nh)G.host=nh.id}
    if(G.phase=='play'){
      p.packed=true;
      if(s&&(s.from==j||s.to==j)){if(s.to==j)G.turn=s.from;G.side=null;nextTurn()}
      else if(wasTurn)nextTurn();
      if(live().length==1)finish(live()[0],null);
      else if(live().length==0)G.phase='closed';
    }
    if(!G.players.some(x=>!x.left))G.phase='closed';
    if(await save())break;
  }
  render();
}
async function closeGame(){
  if(G.host!=me.id||G.phase=='play')return;
  if(!confirm('Close the game for everyone and show who owes whom?'))return;
  G.phase='closed';lg('Game closed by host');await save();
}
function nets(){
  const m={},add=x=>{const e=m[x.id]||(m[x.id]={id:x.id,name:x.name,chips:0,buyin:0});e.name=x.name;e.chips+=x.chips;e.buyin+=x.buyin};
  (G.gone||[]).forEach(add);G.players.forEach(add);(G.wait||[]).forEach(add);
  return Object.values(m).map(e=>({...e,net:e.chips-e.buyin})).sort((a,b)=>b.net-a.net);
}
function owes(rows){
  const d=rows.filter(r=>r.net<0).map(r=>({n:r.name,a:-r.net})).sort((a,b)=>b.a-a.a),c=rows.filter(r=>r.net>0).map(r=>({n:r.name,a:r.net})).sort((a,b)=>b.a-a.a),out=[];
  let i=0,j=0;
  while(i<d.length&&j<c.length){const x=Math.min(d[i].a,c[j].a);out.push([d[i].n,c[j].n,x]);d[i].a-=x;c[j].a-=x;if(d[i].a<=0)i++;if(c[j].a<=0)j++}
  return out;
}
function settleBody(){
  const rows=nets(),pay=owes(rows);
  return `<table style="width:100%;margin-top:6px;font-size:14px;border-collapse:collapse">
  <tr class="mu"><td>Player</td><td align="right">Bought in</td><td align="right">Chips</td><td align="right">Net</td></tr>
  ${rows.map(r=>`<tr><td>${esc(r.name)}</td><td align="right">${r.buyin}</td><td align="right">${r.chips}</td><td align="right" class="${r.net>=0?'pos':'neg'}">${r.net>=0?'+':''}${r.net}</td></tr>`).join('')}</table>
  <div class="gl" style="margin-top:10px">Who pays whom</div>
  ${pay.length?pay.map(x=>`<div>${esc(x[0])} pays ${esc(x[1])} <b>${x[2]}</b></div>`).join(''):'<div class="mu">Nobody owes anything.</div>'}
  ${G.phase=='play'?`<div class="mu" style="margin-top:6px">A round is still being played (pot ${G.pot}). These amounts can change when it ends.</div>`:''}`;
}
function finalH(closed){
  return `<div class="panel"><div class="gl">${closed?'Game closed':'You left the table'}</div>${settleBody()}<button class="pri" data-a="home">Back to start</button></div>`;
}

/* ---------- chat ---------- */
let chOpen=false,chSeen=-1,rxSeen=-1;
function renderChat(){
  const btn=$('chBtn');
  if(!G){btn.style.display='none';$('rxBtn').style.display='none';return}
  btn.style.display='block';$('rxBtn').style.display='block';
  const ms=G.chat||[],lastT=ms.length?ms[ms.length-1].t:0;
  if(chSeen<0)chSeen=lastT;
  if(rxSeen<0)rxSeen=lastT;
  ms.filter(x=>x.r&&x.t>rxSeen).forEach(x=>{const d=document.createElement('div');d.className='rxm'+(x.m.length>3?' tx':'');d.innerHTML=esc(x.m)+'<small>'+esc(x.n)+'</small>';$('rxBox').appendChild(d);setTimeout(()=>d.remove(),3000)});
  rxSeen=Math.max(rxSeen,lastT);
  if(chOpen){
    const el=$('chList'),atEnd=el.scrollTop+el.clientHeight>=el.scrollHeight-60;
    el.innerHTML=ms.map(x=>`<div class="cm ${x.id==me.id?'me':''}"><span class="cn">${esc(x.n)}</span> ${esc(x.m)}</div>`).join('')||'<div class="mu">No messages yet. Say hi!</div>';
    if(atEnd)el.scrollTop=el.scrollHeight;
    chSeen=lastT;
  }
  const un=chOpen?0:ms.filter(x=>x.t>chSeen&&x.id!=me.id).length;
  $('chBadge').textContent=un||'';
}
function toggleChat(){
  chOpen=!chOpen;$('chBox').hidden=!chOpen;
  if(chOpen){renderChat();const el=$('chList');el.scrollTop=el.scrollHeight;$('chIn').focus()}else renderChat();
}
async function sendMsg(v,r){
  if(!v||!G)return;
  for(let t=0;t<4;t++){
    G.chat=(G.chat||[]).concat([{id:me.id,n:me.name,t:Date.now(),m:v.slice(0,200),r:r?1:0}]).slice(-60);
    if(await save()){const l=$('chList');l.scrollTop=l.scrollHeight;return}
  }
}
async function sendChat(){const el=$('chIn'),v=el.value.trim();if(!v||!G)return;el.value='';return sendMsg(v,false)}

/* ---------- turn timer ---------- */
let tkey='',tstart=Date.now(),busy=false;
function tk(){const k=G.round+':'+(G.tid||0)+':'+(G.side?'s':'');if(k!==tkey){tkey=k;tstart=Date.now()}}
function leftSecs(){return Math.max(0,Math.ceil((G.cfg.turnSecs||0)-(Date.now()-tstart)/1000))}
async function autoAct(){
  if(G.side){
    const s=G.side,b=G.players[s.to];G.turn=s.from;G.side=null;b.last='Timed out';
    lg(b.name+' ran out of time, side show declined');nextTurn();await save();return;
  }
  const p=G.players[G.turn];p.packed=true;p.last='Packed (time)';lg(p.name+' ran out of time and was packed');
  live().length==1?finish(live()[0],null):nextTurn();await save();
}
setInterval(()=>{
  if(!G||G.phase!='play'||!(G.cfg.turnSecs>0))return;
  tk();const secs=G.cfg.turnSecs,el=(Date.now()-tstart)/1000,t=$('tm');if(t)t.textContent=leftSecs();
  const owner=G.side?G.players[G.side.to].id:G.players[G.turn].id;
  if(el>=secs+(owner==me.id?0:2.5)&&!busy){busy=true;autoAct().finally(()=>{busy=false})}
},1000);

/* ---------- UI ---------- */
function seatsH(){
  const vis=G.players.map((q,i)=>i).filter(i=>!G.players[i].left),n=vis.length,play=G.phase=='play',over=G.phase=='over',R=G.result;
  const mi=Math.max(0,vis.indexOf(idx()));
  return vis.map((_,k)=>{
    const i=vis[(mi+k)%n],q=G.players[i],ang=Math.PI/2+2*Math.PI*k/n;
    const x=50+43*Math.cos(ang),y=50+43*Math.sin(ang),net=q.chips-q.buyin;
    const rv=over&&R&&q.cards&&((R.show&&!q.packed)||(R.roy||[]).some(r=>r.h==i));
    const st=q.packed?'packed':play?(q.seen?'seen':'blind'):'';
    const cls=(play&&G.turn==i&&!q.packed?'turn ':'')+(play&&q.packed?'out ':'')+(over&&R&&R.w==i?'win':'');
    return `<div class="seat ${cls}" style="left:${x}%;top:${y}%">${G.dealer==i&&G.round?'<span class="dbtn">D</span>':''}<b>${esc(q.name)}${q.id==me.id?' ★':''}</b>${q.chips}
      <div class="${net>=0?'pos':'neg'}">${net>=0?'+':''}${net}</div><div class="mu">${st}</div>${q.last&&(play||over)?`<div class="lm">${esc(q.last)}</div>`:''}
      ${rv?`<div class="cs">${q.cards.map(c=>cardH(c,false,true)).join('')}</div>`:''}</div>`}).join('');
}
function controls(p,i){
  const play=G.phase=='play',cf=G.cfg,ry=`Royalty AAA ${cf.rAAA} · face trio ${cf.rFace} · number trio ${cf.rNum} · max blind turns ${cf.maxBlind||'no limit'} · timer ${cf.turnSecs?cf.turnSecs+'s':'off'}`;
  if(!play){
    if(G.phase=='lobby'){
      const d=draft||{boot:cf.boot,start:cf.start,max:cf.max,aaa:cf.rAAA,face:cf.rFace,num:cf.rNum,blind:cf.maxBlind||0,turn:cf.turnSecs||0};
      if(G.host==me.id)return `<div class="gl">Table settings (host)</div><div class="g2">
      <label class="mu">Boot<input id="c_boot" type="number" value="${d.boot}"></label>
      <label class="mu">Starting chips<input id="c_start" type="number" value="${d.start}"></label>
      <label class="mu">Max chaal<input id="c_max" type="number" value="${d.max}"></label>
      <label class="mu">Royalty AAA<input id="c_aaa" type="number" value="${d.aaa}"></label>
      <label class="mu">Royalty KKK/QQQ/JJJ<input id="c_face" type="number" value="${d.face}"></label>
      <label class="mu">Royalty number trios<input id="c_num" type="number" value="${d.num}"></label>
      <label class="mu">Max blind turns (0 = no limit)<input id="c_blind" type="number" value="${d.blind}"></label>
      <label class="mu">Turn timer, seconds (0 = off)<input id="c_turn" type="number" value="${d.turn}"></label></div>
      <div class="mu">Set a royalty to 0 to switch it off.</div><button class="pri" data-a="deal">Deal</button>`;
      return `<div class="mu">Waiting for the host to deal.<br>Boot ${cf.boot} · start ${cf.start} · max chaal ${cf.max}<br>${ry}</div>`;
    }
    return (G.host==me.id?`<button class="pri" data-a="deal">Next round</button>`:'<div class="mu">Waiting for the host to deal…</div>')+`<div class="mu">Boot ${cf.boot} · max chaal ${cf.max}<br>${ry}</div>`;
  }
  if(G.side){
    const s=G.side,b=G.players[s.to];
    if(b.id==me.id)return `<div class="gl">${esc(G.players[s.from].name)} asks for a side show</div><button class="pri" data-a="yes">Accept</button><button class="dng" data-a="no">Decline</button>`;
    return `<div class="mu">Side show: waiting for ${esc(b.name)} to answer…</div>`;
  }
  if(!p)return '<div class="mu">You will join next round.</div>';
  if(G.turn!=i)return p.packed?'<div class="mu">You packed. Waiting for the round to finish…</div>':`<div class="mu">Waiting for ${esc(G.players[G.turn].name)}…</div>${p.seen?'':'<button data-a="see">See cards</button>'}`;
  const ti=turnInfo(p),cost=(p.seen?2:1)*G.stake*(ti.triple?3:1),hi=Math.floor(cf.max/2),lo=G.stake+cf.boot,L=live().length;
  const free=!ti.force&&!ti.counter;
  const canRaise=free&&lo<=hi;if(!(rs>=lo&&rs<=hi))rs=lo;
  const prev=prevLive(i),canSide=free&&L>=3&&p.seen&&G.players[prev].seen;
  const note=ti.force?'<div class="mu">You must see your cards before you can play.</div>':ti.counter?'<div class="mu">A chaal was played. You can counter (staying blind) or see your cards.</div>':(p.seen&&ti.triple?'<div class="mu">Counter played: chaal is now ×3.</div>':'');
  return `<div class="gl">Your turn</div>${note}${p.seen?'':'<button data-a="see">See cards</button>'}
  ${ti.chaal!=null?`<button class="pri" data-a="chaal">${p.seen?(ti.triple?'Chaal ×3':'Chaal'):'Blind'} ${ti.chaal}</button>`:''}
  ${ti.counter?`<button class="pri" data-a="counter">${ti.label} ${ti.counter}</button>`:''}
  ${L==2?`<button data-a="show">Show ${cost}</button>`:''}
  ${canSide?`<button data-a="side">Side show ${cost}</button>`:''}
  <button class="dng" data-a="pack">Pack</button>
  ${canRaise?`<div class="mu" style="margin-top:8px">Raise stake to <b id="rl">${rs}</b> · you pay <b id="rc">${p.seen?2*rs:rs}</b></div>
  <input type="range" id="rs" min="${lo}" max="${hi}" step="${cf.boot}" value="${rs}"><button data-a="raise">Raise</button>`:''}`;
}
function settleH(){
  return `<details class="panel" ${G.phase=='over'?'open':''}><summary>Settle up</summary>${settleBody()}</details>`;
}
function render(){
  if(!G)return;
  tk();renderChat();
  const mi0=idx(),mp0=G.players[mi0],gone0=(G.gone||[]).some(x=>x.id==me.id)&&mi0<0&&!inWait();
  if(G.phase=='closed'||(mp0&&mp0.left)||gone0){app.innerHTML=finalH(G.phase=='closed');return}
  if($('c_boot'))draft={boot:+$('c_boot').value,start:+$('c_start').value,max:+$('c_max').value,aaa:+$('c_aaa').value,face:+$('c_face').value,num:+$('c_num').value,blind:+$('c_blind').value,turn:+$('c_turn').value};
  const i=idx(),p=G.players[i],play=G.phase=='play',over=G.phase=='over',R=G.result;
  let h=`<div class="table"><div class="felt"></div><div class="mid"><div class="mu">POT</div><div class="pot">${G.pot}</div>${play?`<div class="mu">stake ${G.stake} · max chaal ${G.cfg.max}</div><div class="mu">Blind ${G.stake} · Seen ${G.stake*2}</div>${G.ctr?`<div class="mu">Last chaal ${G.ctr.C}${G.ctr.n?` · counters ${G.ctr.n}/2 · next chaal ×3`:''}</div>`:''}<div class="gl">▶ ${esc(G.players[G.turn].name)}</div>${G.cfg.turnSecs>0?`<div class="mu">⏱ <span id="tm">${leftSecs()}</span>s</div>`:''}`:''}${over&&R?`<div class="gl">🏆 ${esc(G.players[R.w].name)} wins ${R.pot}</div>${(R.roy||[]).map(r=>`<div class="gl">👑 ${esc(G.players[r.h].name)} ${r.hn}: ${r.amt} × ${r.n}</div>`).join('')}`:''}</div>${seatsH()}</div>`;
  if(p&&p.cards&&(play||over)){
    const show=p.seen||over;
    h+=`<div class="panel"><div class="mu" style="text-align:center">Your cards${show?' · '+hname(p.cards):''}</div><div class="cs">${p.cards.map(c=>cardH(c,!show)).join('')}</div></div>`;
  }
  h+=`<div class="panel">${controls(p,i)}</div>`;
  if(p||(G.wait||[]).some(w=>w.id==me.id)){
    const me_=p||G.wait.find(w=>w.id==me.id);
    h+=`<div class="panel"><div class="gl">Add chips</div><div class="mu">Anytime, even mid-round. Your total buy-in: ${me_.buyin}</div><input id="tu" type="number" placeholder="Amount" value="${esc(tuv)}"><button data-a="topup">Top up</button></div>`;
  }
  if((G.wait||[]).length)h+=`<div class="mu">Joining next round: ${G.wait.map(w=>esc(w.name)).join(', ')}</div>`;
  if(G.round)h+=settleH();
  if(p)h+=`<div class="panel"><button class="dng" data-a="exit">Exit table</button>${G.host==me.id?`${G.round?'<button class="dng" data-a="reset">Reset game</button>':''}${play?'':'<button class="dng" data-a="close">Close game</button>'}<div class="mu">Close ends the game for everyone and shows who owes whom${play?' (available between rounds)':''}. Reset starts everyone fresh and forgets the settlement.</div>`:''}</div>`;
  h+=`<div class="panel log">${G.log.slice(-6).reverse().map(esc).join('<br>')}</div>
  <details class="panel"><summary>Hand ranking</summary><div class="mu" style="margin-top:6px">1 Trail (AAA … 222)<br>2 Pure sequence<br>3 Sequence<br>Both sequences: 235 highest, then AKQ, A23, KQJ … 234; same sequence → higher suit of top card<br>4 Colour (compare card by card, then suit)<br>5 Pair (then third card, then suit of the pair’s higher card)<br>6 High card<br>Suits: ♠ › ♥ › ♦ › ♣</div></details>`;
  app.innerHTML=h;just=false;
}
document.addEventListener('click',e=>{
  const q=e.target.closest('[data-q]');if(q){$('rxPop').hidden=true;if(G)sendMsg(q.dataset.q,true);return}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a=='rx'){$('rxPop').hidden=!$('rxPop').hidden;return}
  if(a=='join')return enter();
  if(!G)return;
  if(a=='deal')deal();else if(a=='topup')topup();else if(a=='reset')resetGame();else if(a=='exit')exitGame();else if(a=='close')closeGame();else if(a=='home')location.reload();else if(a=='chat')toggleChat();else if(a=='send')sendChat();else if(a=='yes')sideAns(true);else if(a=='no')sideAns(false);
  else if(a=='raise')doAct('raise',rs);else doAct(a);
});
document.addEventListener('input',e=>{
  if(e.target.id=='tu'){tuv=e.target.value;return}
  if(e.target.id!='rs'||!G)return;rs=+e.target.value;const p=G.players[idx()];
  $('rl').textContent=rs;$('rc').textContent=p.seen?2*rs:rs;
});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='chIn')sendChat()});
login();
</script></body></html>
